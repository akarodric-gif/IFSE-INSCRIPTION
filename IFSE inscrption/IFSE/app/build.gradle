plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ifse.education'
    compileSdk 34

    defaultConfig {
        applicationId "com.ifse.education"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signé avec la clé debug pour obtenir un APK directement installable.
            // Remplacez par votre propre keystore pour une publication sur le Play Store.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
